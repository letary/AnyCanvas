name: ci
on: [push, pull_request]
jobs:
  core-and-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y ninja-build
      - run: bun install --frozen-lockfile
      - run: bun run check:spec
      - run: bun run typecheck
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: bun test tests/ts
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  rust-css-color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/css-color/Cargo.toml
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: swift build
      - run: cmake -S . -B build-posix -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-posix
      - run: swift test
      - run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          xcodebuild test -scheme AnyCanvas-Package -destination "platform=iOS Simulator,name=$DEST" -derivedDataPath .build/xcode
      - run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          xcodebuild build -project painters/apple/demo/AnyCanvasDemo.xcodeproj -scheme AnyCanvasDemo -destination "platform=iOS Simulator,name=$DEST" -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO
